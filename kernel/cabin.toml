[package]
name = "basil"
version = "0.1.0"
cxx-standard = "c++26"

[dependencies]
libk = { path = "../libk" }

[profile]
cxxflags = ["-freflection"]

[target.kernel]
type = "executable"
include-dirs = ["src"]
deps = ["libk"]
sources = [
    "src/main.cpp",
    "src/shell.cpp",
    "src/boot/limine.cpp",
    "src/acpi/acpi.cpp",
    "src/arch/x86_64/apic.cpp",
    "src/arch/x86_64/gdt.cpp",
    "src/arch/x86_64/idt.cpp",
    "src/arch/x86_64/pic.cpp",
    "src/arch/x86_64/pit.cpp",
    "src/core/panic.cpp",
    "src/core/print.cpp",
    "src/core/runtime.cpp",
    "src/core/test.cpp",
    "src/gfx/console.cpp",
    "src/gfx/demo.cpp",
    "src/gfx/font.cpp",
    "src/gfx/framebuffer.cpp",
    "src/drivers/keyboard/keyboard.cpp",
    "src/drivers/pci/pci.cpp",
    "src/drivers/serial/serial.cpp",
    "src/mm/frames.cpp",
    "src/mm/paging.cpp",
    "src/mm/heap.cpp",
    "src/sched/scheduler.cpp",
    "src/sched/thread.cpp",
    "tests/heap.cpp",
    "tests/paging.cpp",
    "tests/sanity.cpp",
]

[target.'cfg(os = "linux")'.profile]
cxxflags = [
    "-Wall",
    "-Wextra",
    "-fno-builtin",
    "-fno-stack-protector",
    "-fno-stack-check",
    "-fno-lto",
    "-fno-PIC",
    "-m64",
    "-march=x86-64",
    "-mabi=sysv",
    "-mno-80387",
    "-mno-mmx",
    "-mno-sse",
    "-mno-sse2",
    "-mno-red-zone",
    "-mcmodel=kernel",
    "-fno-exceptions",
    "-fno-rtti",
    "-fno-threadsafe-statics",
    "-fno-use-cxa-atexit",
]
ldflags = [
    "-nostdlib",
    "-static",
    "-no-pie",
    "-Wl,-T,../../kernel/linker.ld",
    "-Wl,-z,max-page-size=0x1000",
]

[target.'cfg(os = "linux")'.profile.test]
defines = ["KERNEL_TESTS"]
