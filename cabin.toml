# Workspace root. Compiler flags live in each member: the kernel builds
# freestanding, while libk's tests are ordinary host programs.
[workspace]
members = ["kernel", "libk"]

# The kernel is unusably slow unoptimized (a full-screen repaint takes longer
# than a timer tick), so dev builds optimize too; -g keeps them debuggable.
[profile.dev]
opt-level = 2

# Unoptimized build (build/debug/) for stepping through libk's host tests in gdb.
[profile.debug]
inherits = "dev"
opt-level = 0

# Kernel test build (build/test/): the kernel package adds KERNEL_TESTS for it.
[profile.test]
inherits = "dev"
