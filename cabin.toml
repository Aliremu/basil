[package]
name = "basil"
version = "0.1.0"
cxx-standard = "c++26"

# The kernel: a freestanding x86-64 ELF loaded by Limine. `make` packs it into
# a bootable ISO; limine.h reaches the compiler through CPPFLAGS (set by the
# nix dev shell).
[target.kernel]
type = "executable"
sources = ["kernel/main.cpp"]

# cxxflags apply only to C++ sources; a .c file would need these in cflags too.
[profile]
cxxflags = [
  "-Wall", "-Wextra",
  "-ffreestanding", "-fno-stack-protector", "-fno-stack-check", "-fno-lto", "-fno-PIC",
  "-m64", "-march=x86-64", "-mabi=sysv", "-mno-80387", "-mno-mmx", "-mno-sse", "-mno-sse2",
  "-mno-red-zone", "-mcmodel=kernel",
  # No C++ runtime: exceptions, RTTI and guarded statics all need one.
  "-fno-exceptions", "-fno-rtti", "-fno-threadsafe-statics", "-fno-use-cxa-atexit",
]
ldflags = [
  "-nostdlib", "-static", "-no-pie",
  # ninja runs in build/<profile>/, so the script path is relative to that.
  "-Wl,-T,../../kernel/linker.ld", "-Wl,-z,max-page-size=0x1000",
]
